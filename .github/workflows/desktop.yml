name: MURDL Desktop

on:
  push:
    paths: ["Windows/**", "MurdlCore/**", ".github/workflows/desktop.yml"]
  workflow_dispatch:

jobs:
  windows:
    name: Windows app (build, run, screenshot)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: compnerd/gha-setup-swift@main
        with:
          branch: swift-6.1-release
          tag: 6.1-RELEASE
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Build the Swift engine DLL
        working-directory: MurdlCore
        run: swift build -c release --product MurdlBridge

      - name: Find the Swift runtime DLLs
        id: swiftrt
        shell: pwsh
        run: |
          $core = (Get-Command swiftCore.dll -ErrorAction Stop).Source
          $dir = (Split-Path $core) + "\"
          "dir=$dir" >> $env:GITHUB_OUTPUT
          Write-Host "Swift runtime: $dir"

      - name: Publish MURDL for Windows
        working-directory: Windows/Murdl.Desktop
        shell: pwsh
        run: |
          dotnet publish -c Release -r win-x64 --self-contained true -o ..\..\dist\win `
            -p:BridgeDir="${{ github.workspace }}\MurdlCore\.build\release\" `
            -p:SwiftRuntimeDir="${{ steps.swiftrt.outputs.dir }}"
          Get-ChildItem ..\..\dist\win | Select-Object Name,Length | Format-Table | Out-String | Write-Host

      - name: Run MURDL and capture a screenshot
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Drawing
          Add-Type -AssemblyName System.Windows.Forms
          $p = Start-Process -FilePath "${{ github.workspace }}\dist\win\MURDL.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) { throw "MURDL exited early with code $($p.ExitCode)" }
          [System.Windows.Forms.SendKeys]::SendWait("crane{ENTER}")
          Start-Sleep -Seconds 1
          [System.Windows.Forms.SendKeys]::SendWait("st{F2}")
          Start-Sleep -Seconds 2
          $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
          $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
          $g = [System.Drawing.Graphics]::FromImage($bmp)
          $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
          New-Item -ItemType Directory -Force shots | Out-Null
          $bmp.Save("shots\murdl-windows.png")
          Write-Host "Screen $($b.Width)x$($b.Height) captured; MURDL still running: $(-not $p.HasExited)"
          Stop-Process -Id $p.Id -Force

      - uses: actions/upload-artifact@v4
        with:
          name: MURDL-windows-x64
          path: dist/win
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MURDL-windows-screenshot
          path: shots/murdl-windows.png
          if-no-files-found: error

  macos:
    name: macOS app bundle
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build the Swift engine dylib
        working-directory: MurdlCore
        run: swift build -c release --product MurdlBridge
      - name: Publish and bundle
        working-directory: Windows/Murdl.Desktop
        run: |
          dotnet publish -c Release -r osx-arm64 --self-contained true -o ../../dist/mac
          ./make-mac-app.sh ../../dist/mac
          ditto -c -k --keepParent ../../dist/mac/MURDL.app ../../dist/MURDL-macOS-arm64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: MURDL-macOS-arm64
          path: dist/MURDL-macOS-arm64.zip
          if-no-files-found: error
