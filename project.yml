name: Murdl
packages:
  MurdlCore:
    path: MurdlCore

options:
  bundleIdPrefix: com.billdonner
  deploymentTarget:
    macOS: "26.0"
    iOS: "26.0"
  createIntermediateGroups: true

targets:
  # iOS app on the same App Store record and bundle id as the Mac app (universal purchase).
  # Shares Models and Views; only Sources/MurdlIOS is iOS-specific. Never links MurdlBridge.
  MurdlIOS:
    type: application
    platform: iOS
    productName: MURDL
    sources:
      - path: Sources/MurdlIOS
      - path: Sources/Murdl/Models
      - path: Sources/Murdl/Views
      - path: Sources/Murdl/Resources/Assets.xcassets
        buildPhase: resources
    dependencies:
      - package: MurdlCore
    settings:
      base:
        CODE_SIGN_STYLE: Automatic
        PRODUCT_NAME: MURDL
        PRODUCT_BUNDLE_IDENTIFIER: com.billdonner.murdl27
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "6.0"
        IPHONEOS_DEPLOYMENT_TARGET: "26.0"
        TARGETED_DEVICE_FAMILY: "2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: MURDLAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: NEAY582ME4
    info:
      path: Sources/MurdlIOS/App/Info.plist
      properties:
        CFBundleDisplayName: MURDL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.word-games
        NSHumanReadableCopyright: Copyright 1041soft.com
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight

  Murdl:
    type: application
    platform: macOS
    productName: MURDL
    sources:
      - path: Sources/Murdl/App
      - path: Sources/Murdl/Models
      - path: Sources/Murdl/Views
      - path: Sources/Murdl/Resources/Assets.xcassets
        buildPhase: resources
      - path: Sources/Murdl/Resources/Help.md
        buildPhase: resources
    dependencies:
      - package: MurdlCore
    entitlements:
      path: Sources/Murdl/App/Murdl.entitlements
      properties:
        com.apple.security.app-sandbox: true
    settings:
      base:
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        PRODUCT_BUNDLE_IDENTIFIER: com.billdonner.murdl27
        MARKETING_VERSION: "2.2"
        CURRENT_PROJECT_VERSION: 3
        SWIFT_VERSION: "6.0"
        MACOSX_DEPLOYMENT_TARGET: "26.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: MURDLAppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        DEVELOPMENT_TEAM: NEAY582ME4
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.word-games
    info:
      path: Sources/Murdl/App/Info.plist
      properties:
        CFBundleDisplayName: MURDL
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.word-games
        NSHumanReadableCopyright: Copyright 1041soft.com

schemes:
  Murdl:
    build:
      targets:
        Murdl: all
    run:
      config: Debug
    archive:
      config: Release
  MurdlIOS:
    build:
      targets:
        MurdlIOS: all
    run:
      config: Debug
    archive:
      config: Release
