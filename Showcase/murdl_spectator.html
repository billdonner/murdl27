<title>MURDL Spectator</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,800&family=IBM+Plex+Mono:wght@500;700&display=swap">
<style>
:root {
  --ground: #EFEEE8;
  --panel: #FFFFFF;
  --ink: #1B1D23;
  --ink-2: #5C606B;
  --line: #D9D8D1;
  --tile-empty: #E4E3DC;
  --tile-edit: #F6F5EF;
  --correct: #35B457;
  --present: #EC9A2E;
  --absent: #8B8F98;
  --key: #FFFFFF;
  --key-ink: #1B1D23;
  --shadow: 0 10px 30px rgba(20, 22, 30, 0.10);
  --b0: #1AB252; --b1: #F28C14; --b2: #1A7DEB; --b3: #DB3852;
  --b4: #8F5CE6; --b5: #00A1AB; --b6: #D4AB1F; --b7: #E0529E;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #15171D; --panel: #1E2129; --ink: #F1F0EA; --ink-2: #9A9EA9;
    --line: #2B2F39; --tile-empty: #262A33; --tile-edit: #30343F;
    --correct: #3DBE5B; --present: #F2A33A; --absent: #5E626C;
    --key: #2A2E38; --key-ink: #F1F0EA; --shadow: 0 10px 30px rgba(0,0,0,0.45);
  }
}
:root[data-theme="dark"] {
  --ground: #15171D; --panel: #1E2129; --ink: #F1F0EA; --ink-2: #9A9EA9;
  --line: #2B2F39; --tile-empty: #262A33; --tile-edit: #30343F;
  --correct: #3DBE5B; --present: #F2A33A; --absent: #5E626C;
  --key: #2A2E38; --key-ink: #F1F0EA; --shadow: 0 10px 30px rgba(0,0,0,0.45);
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--ground); color: var(--ink);
  font-family: -apple-system, "Helvetica Neue", Arial, sans-serif;
  min-height: 100vh; display: flex; flex-direction: column;
}
.stage { width: min(1400px, 100%); margin: 0 auto; padding: 18px 20px 28px; display: flex; flex-direction: column; gap: 14px; flex: 1; }

/* Scoreboard strip */
.top { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 22px; }
.brand { display: flex; align-items: baseline; gap: 12px; }
.brand h1 {
  margin: 0; font-family: "Bricolage Grotesque", "Helvetica Neue", sans-serif;
  font-weight: 800; font-size: 40px; letter-spacing: -0.02em; line-height: 1;
  background: linear-gradient(90deg, var(--b0), var(--b1), var(--b2)); -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand small { font-size: 13px; color: var(--ink-2); font-weight: 600; letter-spacing: 0.02em; }
.stats { display: flex; gap: 26px; justify-content: center; }
.stat { display: flex; flex-direction: column; align-items: flex-end; min-width: 64px; }
.stat b { font-family: "IBM Plex Mono", ui-monospace, monospace; font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.05; }
.stat span { font-size: 11px; color: var(--ink-2); text-transform: uppercase; letter-spacing: 0.08em; font-weight: 600; }
.controls { display: flex; gap: 8px; align-items: center; }
.controls button, .controls select {
  font: 600 13px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink);
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 9px 13px; cursor: pointer;
}
.controls button:hover { border-color: var(--ink-2); }
.controls button:focus-visible, .controls select:focus-visible { outline: 2px solid var(--b2); outline-offset: 2px; }
.controls .primary { background: var(--ink); color: var(--ground); border-color: var(--ink); min-width: 84px; }
.acc { display: flex; align-items: center; gap: 8px; padding: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; font: 600 12px/1 -apple-system, "Helvetica Neue", Arial, sans-serif; color: var(--ink-2); }
.acc input { width: 110px; accent-color: var(--b2); margin: 0; }
.acc input:focus-visible { outline: 2px solid var(--b2); outline-offset: 2px; }
.acc b { font: 700 13px/1 "IBM Plex Mono", monospace; color: var(--ink); min-width: 34px; text-align: right; font-variant-numeric: tabular-nums; }

/* Boards */
.boards { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; flex: 1; align-content: start; }
.board {
  --accent: var(--b0);
  border: 1px solid color-mix(in srgb, var(--accent) 60%, transparent); border-radius: 9px; padding: 7px;
  background: linear-gradient(160deg, color-mix(in srgb, var(--accent) 22%, var(--panel)), var(--panel));
  display: flex; flex-direction: column; gap: 6px; transition: box-shadow .3s, transform .3s;
}
.board.target { box-shadow: 0 0 0 2px var(--accent), var(--shadow); transform: translateY(-2px); }
.board.solved { border-color: var(--accent); }
.board.lost { opacity: 0.72; }
.bh { display: flex; justify-content: space-between; align-items: center; gap: 4px; }
.bh .num { background: var(--accent); color: #fff; font: 700 12px/1 "IBM Plex Mono", monospace; padding: 4px 7px; border-radius: 999px; }
.bh .st { font: 700 11px/1 "IBM Plex Mono", monospace; color: var(--ink-2); white-space: nowrap; }
.board.solved .bh .st, .board.lost .bh .st { color: var(--accent); }
.rows { display: grid; gap: 3px; }
.row { display: grid; grid-template-columns: repeat(5, 1fr); gap: 3px; }
.tile {
  aspect-ratio: 1; border-radius: 4px; display: grid; place-items: center;
  font: 800 clamp(11px, 1.35vw, 19px)/1 "Bricolage Grotesque", "Helvetica Neue", sans-serif;
  background: color-mix(in srgb, var(--accent) 22%, var(--tile-empty)); color: var(--ink);
  border: 1px solid color-mix(in srgb, var(--ink) 10%, transparent);
  transform-style: preserve-3d; transition: transform .45s cubic-bezier(.4,0,.2,1), background .15s;
}
.tile.edit { background: color-mix(in srgb, var(--accent) 45%, var(--tile-edit)); border-color: var(--accent); }
.tile.absent { background: var(--absent); color: #fff; border-color: transparent; }
.tile.present { background: var(--present); color: #fff; border-color: transparent; }
.tile.correct { background: var(--correct); color: #fff; border-color: transparent; }
.tile.flip { animation: flip .5s cubic-bezier(.4,0,.2,1); }
@keyframes flip { 0% { transform: rotateX(0); } 50% { transform: rotateX(90deg); } 100% { transform: rotateX(0); } }
.tile.pop { animation: pop .18s ease-out; }
@keyframes pop { 50% { transform: scale(1.12); } }

/* Commentary and keyboard */
.under { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; }
.commentary { min-height: 52px; display: flex; flex-direction: column; gap: 3px; }
.commentary .lead { font-family: "Bricolage Grotesque", "Helvetica Neue", sans-serif; font-weight: 800; font-size: 22px; letter-spacing: -0.01em; text-wrap: balance; }
.commentary .sub { color: var(--ink-2); font-size: 13px; font-weight: 500; }
.keys { display: grid; gap: 4px; justify-items: center; }
.krow { display: flex; gap: 4px; }
.key {
  width: 30px; height: 34px; border-radius: 5px; display: grid; place-items: center;
  font: 700 14px/1 "IBM Plex Mono", monospace; background: var(--key); color: var(--key-ink);

.key.absent { background: var(--absent); color: #fff; border-color: transparent; }
.key.present { background: var(--present); color: #fff; border-color: transparent; }
.key.correct { background: var(--correct); color: #fff; border-color: transparent; }

/* Result card */
.result {
  position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none;
  background: color-mix(in srgb, var(--ground) 55%, transparent); opacity: 0; transition: opacity .35s;
}
.result.show { opacity: 1; pointer-events: auto; }
.card {

.result.show .card { transform: none; }
.card .verdict { font-family: "Bricolage Grotesque", "Helvetica Neue", sans-serif; font-weight: 800; font-size: 34px; letter-spacing: -0.02em; line-height: 1; }
.card .verdict.won { color: var(--correct); }
.card .verdict.lost { color: var(--present); }
.card .score { font: 700 30px/1 "IBM Plex Mono", monospace; letter-spacing: 0.06em; }
.card .grid { display: flex; gap: 5px; flex-wrap: wrap; }
.card .grid span { width: 34px; height: 34px; border-radius: 7px; display: grid; place-items: center; color: #fff; font: 700 13px/1 "IBM Plex Mono", monospace; }
.card p { margin: 0; color: var(--ink-2); font-size: 14px; line-height: 1.45; }
.card .next { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); }
.card .bar { flex: 1; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.card .bar i { display: block; height: 100%; width: 0; background: var(--ink); transition: width linear; }

@media (max-width: 900px) {
  .boards { grid-template-columns: repeat(4, minmax(0, 1fr)); }
  .top { grid-template-columns: 1fr; }
  .under { grid-template-columns: 1fr; }
  .keys { justify-items: start; }
}
@media (prefers-reduced-motion: reduce) {
  .tile, .board, .card, .result { transition: none; }
  .tile.flip, .tile.pop { animation: none; }
}

const PACE = {

// Scoring, identical to the app: exact matches first, then leftovers for orange.
function score(guess, answer) {
  const marks = Array(LEN).fill("absent"), left = {};

  for (let i = 0; i < LEN; i++) {
    if (marks[i] === "correct") continue;
    if (left[guess[i]] > 0) { marks[i] = "present"; left[guess[i]]--; }
  }
  return marks;
}
const consistent = (word, guess, marks) => score(guess, word).every((m, i) => m === marks[i]);

// State
let games = 0, wins = 0, paused = false, running = null, startedAt = 0, clockTimer = null;
let game;

function newGame() {
  const answers = [], pool = WORDS.slice();
  while (answers.length < BOARDS) answers.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  game = {
    answers, row: 0, guesses: [],
    boards: answers.map((a, i) => ({ id: i, answer: a, solvedRow: null, lost: false, cands: WORDS.slice(), history: [] })),
    keys: {}, over: false,
  };
  startedAt = 0; $("sClock").textContent = "0:00";
  buildBoards(); buildKeys(); updateStats();
  say("Dealing eight new words.", "Every guess is played on every unfinished board.");
}

function buildBoards() {
  const host = $("boards"); host.innerHTML = "";
  game.boards.forEach(b => {
    const el = document.createElement("div"); el.className = "board"; el.style.setProperty("--accent", `var(--b${b.id})`); el.id = "b" + b.id;
    el.innerHTML = `<div class="bh"><span class="num">#${b.id + 1}</span><span class="st">Ready 1/${GUESSES}</span></div><div class="rows"></div>`;
    const rows = el.querySelector(".rows");
    for (let r = 0; r < GUESSES; r++) {
      const row = document.createElement("div"); row.className = "row";
      for (let c = 0; c < LEN; c++) { const t = document.createElement("div"); t.className = "tile"; row.appendChild(t); }
      rows.appendChild(row);
    }
    host.appendChild(el);
  });
}
function buildKeys() {
  const host = $("keys"); host.innerHTML = "";
  ["QWERTYUIOP", "ASDFGHJKL", "ZXCVBNM"].forEach(r => {
    const row = document.createElement("div"); row.className = "krow";
    for (const ch of r) { const k = document.createElement("div"); k.className = "key"; k.id = "k" + ch; k.textContent = ch; row.appendChild(k); }
    host.appendChild(row);
  });
}
const RANK = { absent: 1, present: 2, correct: 3 };
function markKey(letter, mark) {
  const k = $("k" + letter.toUpperCase()), cur = game.keys[letter];
  if (!cur || RANK[mark] > RANK[cur]) { game.keys[letter] = mark; k.className = "key " + mark; }
}
function tile(b, r, c) { return $("b" + b).children[1].children[r].children[c]; }
function status(b) {
  const el = $("b" + b.id).querySelector(".st");
  if (b.solvedRow !== null) el.textContent = `Won ${b.solvedRow + 1}/${GUESSES}`;
  else if (b.lost) el.textContent = `Lost ${b.answer.toUpperCase()}`;
  else el.textContent = `Ready ${Math.min(game.row + 1, GUESSES)}/${GUESSES}`;
}
function updateStats() {
  $("sSolved").textContent = `${game.boards.filter(b => b.solvedRow !== null).length}/${BOARDS}`;
  $("sRow").textContent = `${Math.min(game.row, GUESSES)}/${GUESSES}`;
  $("sGames").textContent = games; $("sWins").textContent = wins;
}
function say(lead, sub) { $("lead").textContent = lead; if (sub !== undefined) $("sub").textContent = sub; }
function fmt(s) { return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`; }
function tickClock() { if (startedAt && !game.over && !paused) $("sClock").textContent = fmt(Math.floor((Date.now() - startedAt) / 1000)); }

// The solver: attack the board with the fewest candidates once one is nearly pinned down;
// otherwise play a word that splits the most candidates across every unfinished board.
function letterFreq(cands) {
  const f = {};
  for (const w of cands) for (const ch of new Set(w)) f[ch] = (f[ch] || 0) + 1;
  return f;
}
function accuracy() { return Number($("acc").value) / 100; }
function pick(ranked, why) {
  // At 100% the solver always plays its best move. Below that it sometimes plays a hunch:
  // a word further down its own ranking, so the mistake still looks like a real player's.
  const a = accuracy();
  if (ranked.length === 1 || Math.random() < a) return { word: ranked[0], why };
  const depth = Math.min(ranked.length - 1, 1 + Math.floor((1 - a) * 40));
  const i = 1 + Math.floor(Math.random() * depth);
  return { word: ranked[i], why: "playing a hunch", hunch: true };
}
function choose() {
  const open = game.boards.filter(b => b.solvedRow === null && !b.lost);
  if (game.row === 0) return { word: OPENERS[Math.floor(Math.random() * OPENERS.length)], why: "opening with a vowel-heavy word" };
  const used = new Set(game.guesses);
  const tight = open.slice().sort((a, b) => a.cands.length - b.cands.length)[0];
  const remainingGuesses = GUESSES - game.row;
  if (tight.cands.length <= 2 || remainingGuesses <= open.length + 1) {
    const ranked = tight.cands.filter(c => !used.has(c));
    if (!ranked.length) ranked.push(tight.cands[0]);
    // A hunch here is a word that fits the board's greens but not every orange or gray.
    const near = WORDS.filter(w => !used.has(w) && !ranked.includes(w) && tight.history.every(h => h.marks.every((m, i) => m !== "correct" || w[i] === h.guess[i])));
    const r = pick(ranked.concat(near.slice(0, 40)), tight.cands.length === 1 ? `only one word fits board ${tight.id + 1}` : `${tight.cands.length} words fit board ${tight.id + 1}`);
    return { ...r, target: tight.id };
  }
  // Exploration: reward letters that are still unknown on many boards.
  const freqs = open.map(b => ({ f: letterFreq(b.cands), n: b.cands.length, known: new Set(b.history.flatMap(h => h.guess.split(""))) }));
  const pool = tight.cands.length <= 6 ? tight.cands : WORDS;
  const scored = [];
  for (const w of pool) {
    if (used.has(w)) continue;
    let sc = 0;
    for (const ch of new Set(w)) for (const fb of freqs) {
      if (fb.known.has(ch)) continue;
      const p = (fb.f[ch] || 0) / fb.n; sc += p * (1 - p) * 4;
    }
    if (tight.cands.includes(w)) sc += 0.6;
    scored.push([sc, w]);
  }
  scored.sort((x, y) => y[0] - x[0]);
  const ranked = scored.map(x => x[1]);
  const r = pick(ranked, tight.cands.length <= 6 ? `narrowing board ${tight.id + 1}` : `splitting ${open.length} open boards`);
  return { ...r, target: tight.cands.includes(r.word) ? tight.id : undefined };
}

async function waitIfPaused() { while (paused) await sleep(120); }

async function playGuess() {
  const pace = PACE[$("speed").value];
  const { word, target, why, hunch } = choose();
  game.boards.forEach(b => $("b" + b.id).classList.toggle("target", b.id === target));
  say(`Guess ${game.row + 1}: ${word.toUpperCase()}`, hunch ? "The solver is playing a hunch." : `The solver is ${why}.`);
  if (!startedAt) startedAt = Date.now();
  const open = game.boards.filter(b => b.solvedRow === null && !b.lost);
  for (let c = 0; c < LEN; c++) {
    await waitIfPaused();
    for (const b of open) { const t = tile(b.id, game.row, c); t.textContent = word[c].toUpperCase(); t.className = "tile edit pop"; }
    await sleep(pace.type);
  }
  await sleep(pace.beforeFlip);
  const solvedNow = [];
  for (let c = 0; c < LEN; c++) {
    await waitIfPaused();
    for (const b of open) {
      const marks = score(word, b.answer), t = tile(b.id, game.row, c);
      t.className = "tile " + marks[c] + (reduced ? "" : " flip");
      markKey(word[c], marks[c]);
    }
    await sleep(pace.flip);
  }
  for (const b of open) {
    const marks = score(word, b.answer);
    b.history.push({ guess: word, marks });
    b.cands = b.cands.filter(w => consistent(w, word, marks));
    if (marks.every(m => m === "correct")) { b.solvedRow = game.row; solvedNow.push(b); $("b" + b.id).classList.add("solved"); }
    else if (game.row === GUESSES - 1) { b.lost = true; $("b" + b.id).classList.add("lost"); }
  }
  game.guesses.push(word); game.row++;
  game.boards.forEach(status); updateStats();
  const left = game.boards.filter(b => b.solvedRow === null && !b.lost).length;
  if (solvedNow.length) say(`${word.toUpperCase()} solves board ${solvedNow.map(b => b.id + 1).join(" and ")}.`, left ? `${left} board${left > 1 ? "s" : ""} still open, ${GUESSES - game.row} guesses left.` : "Every board is solved.");
  else say(`${word.toUpperCase()} solves nothing yet.`, `${left} boards open, ${GUESSES - game.row} guesses left.`);
  game.boards.forEach(b => $("b" + b.id).classList.remove("target"));
  await sleep(pace.afterRow);
}

function scoreString() {
  const won = game.boards.every(b => b.solvedRow !== null);
  const raw = game.boards.map(b => b.solvedRow !== null ? b.solvedRow + 1 : GUESSES + 1);
  raw.sort((a, b) => won ? a - b : b - a);
  return raw.map(n => n.toString(36).toUpperCase()).join("");
}

async function showResult() {
  const pace = PACE[$("speed").value];
  const won = game.boards.every(b => b.solvedRow !== null), solved = game.boards.filter(b => b.solvedRow !== null).length;
  games++; if (won) wins++; updateStats();
  const seconds = Math.floor((Date.now() - startedAt) / 1000);
  $("verdict").textContent = won ? "Won MURDL" : `Lost, ${solved} of 8`;
  $("verdict").className = "verdict " + (won ? "won" : "lost");
  $("rScore").textContent = scoreString();
  const grid = $("rGrid"); grid.innerHTML = "";
  game.boards.forEach(b => {
    const s = document.createElement("span"); s.style.background = b.solvedRow !== null ? "var(--correct)" : "var(--absent)";
    s.textContent = b.solvedRow !== null ? b.solvedRow + 1 : "×"; s.title = b.answer.toUpperCase(); grid.appendChild(s);
  });
  $("rText").textContent = won
    ? `All eight in ${game.row} guesses and ${fmt(seconds)}. Score reads one character per board, the row it fell on, lowest first.`
    : `Ran out of guesses after ${fmt(seconds)}. Missed: ${game.boards.filter(b => b.solvedRow === null).map(b => b.answer.toUpperCase()).join(", ")}.`;
  say(won ? `Won MURDL ${scoreString()}` : `Lost MURDL ${scoreString()}`, won ? "A new game deals in a moment." : "Better luck on the next deal.");
  const bar = $("bar"); bar.style.transition = "none"; bar.style.width = "0";
  $("result").classList.add("show");
  await sleep(50);
  bar.style.transition = `width ${pace.card}ms linear`; bar.style.width = "100%";
  const until = Date.now() + pace.card;
  while (Date.now() < until) { await waitIfPaused(); await sleep(100); }
  $("result").classList.remove("show");
}

async function loop(token) {
  while (running === token) {
    newGame();
    await sleep(PACE[$("speed").value].think);
    while (!game.over && running === token) {
      await waitIfPaused();
      await playGuess();
      game.over = game.boards.every(b => b.solvedRow !== null || b.lost);
    }
    if (running !== token) return;
    await showResult();
  }
}

function restart() { running = Symbol(); loop(running); }
$("acc").addEventListener("input", () => { $("accVal").textContent = $("acc").value + "%"; });
$("pause").addEventListener("click", () => {
  paused = !paused; $("pause").textContent = paused ? "Resume" : "Pause"; $("pause").setAttribute("aria-pressed", paused);
});
$("next").addEventListener("click", () => { $("result").classList.remove("show"); paused = false; $("pause").textContent = "Pause"; restart(); });
document.addEventListener("keydown", e => {
  if (e.key === " ") { e.preventDefault(); $("pause").click(); }
  if (e.key.toLowerCase() === "n") $("next").click();
});
clockTimer = setInterval(tickClock, 250);
restart();
</script>
